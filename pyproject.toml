[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-inteligencia-red-electrificacion"
version = "1.0.0"
description = "Sistema analítico de priorización para redes de distribución bajo presión de electrificación."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Miguel Fidalgo Martins", email = "mfidalgomartins@gmail.com" }]
dependencies = [
    "duckdb==1.5.1",
    "fastapi==0.139.0",
    "matplotlib==3.10.8",
    "numpy==2.4.3",
    "pandas==3.0.1",
    "pyarrow==23.0.1",
    "reportlab==4.5.1",
    "tabulate==0.10.0",
    "uvicorn==0.51.0",
]

[project.scripts]
grid-intelligence = "grid_intelligence.__main__:main"
grid-intelligence-api = "grid_intelligence.api.runner:main"
grid-intelligence-ops = "grid_intelligence.ops_cli:main"

[project.optional-dependencies]
dev = ["httpx2==2.9.1", "pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.0"]

[project.urls]
Repository = "https://github.com/mfidalgomartins/sistema-inteligencia-red-electrificacion"
Dashboard = "https://mfidalgomartins.github.io/sistema-inteligencia-red-electrificacion/"

[tool.setuptools.packages.find]
where = ["src"]
include = ["grid_intelligence", "grid_intelligence.*"]

[tool.setuptools.package-data]
grid_intelligence = ["assets/*.js", "assets/*.woff2", "resources/*.json", "resources/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", "build", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # longitud de línea gobernada por el formateador, no como error

[tool.ruff.lint.per-file-ignores]
# matplotlib requiere seleccionar el backend Agg antes de importar pyplot,
# por eso algunas sentencias de módulo preceden legítimamente a los imports.
"src/grid_intelligence/visualization.py" = ["E402"]
"scripts/build_publication_outputs.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["grid_intelligence"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
