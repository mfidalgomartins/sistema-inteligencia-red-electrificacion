[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-inteligencia-red-electrificacion"
version = "1.0.0"
description = "Sistema analítico de priorización para redes de distribución bajo presión de electrificación."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "duckdb==1.5.1",
    "matplotlib==3.10.8",
    "numpy==2.4.3",
    "pandas==3.0.1",
    "reportlab==4.4.10",
    "tabulate==0.10.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.setuptools.package-data]
src = ["assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
