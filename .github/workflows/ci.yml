name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: pytest
      - name: Run analytical pipeline
        run: python -m src
      - name: Build publication artifacts
        run: python scripts/build_publication_outputs.py
      - name: Refresh release manifest
        run: python -m src.release_manifest_v2
      - name: Verify release
        run: |
          python -m src.qa_smoke_v2
          pytest -q tests/test_public_artifacts.py
